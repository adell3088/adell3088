<!DOCTYPE html>

  <title>املاک عادل</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #111111, #292929);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;

      font-size: 55px;
    }

    h1 {
      margin: 5px 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #bbb;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      text-decoration: none;
      padding: 16px;
      margin: 12px 0;
      border-radius: 15px;
      font-size: 17px;
      font-weight: bold;
      background: #f5c400;
      color: #111;
      transition: .2s;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    .phone {
      background: white;
    }

    .footer {
      margin-top: 22px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
