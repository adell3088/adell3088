<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املاک عادل</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#111;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.page{
    width:100%;
    max-width:430px;
    padding:15px 16px;
}

/* لوگو */
.logo-area{
    text-align:center;
    margin-bottom:10px;
}

.logo{
    width:105px;
    height:105px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
    border:4px solid #f5c400;
    box-shadow:0 6px 22px rgba(0,0,0,.45);
}

/* عنوان */
.title{
    text-align:center;
    margin-bottom:13px;
}

.title h1{
    font-size:24px;
    font-weight:900;
    color:#f5c400;
}

.title p{
    margin-top:4px;
    color:#ddd;
    font-size:12px;
}

/* لینک‌ها */
.links{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.link{
    height:55px;
    display:flex;
    align-items:center;
    text-decoration:none;
    color:#fff;
    background:#202020;
    border:1px solid #343434;
    border-radius:15px;
    padding:5px 9px;
}

.icon{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-left:10px;
}

.icon svg{
    width:24px;
    height:24px;
}

.instagram{
    background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
}

.eitaa{
    background:#159bd7;
}

.phone{
    background:#f5c400;
    color:#111;
}

.info{
    flex:1;
}

.info strong{
    display:block;
    font-size:13px;
}

.info span{
    display:block;
    color:#999;
    font-size:10px;
    margin-top:3px;
    direction:ltr;
    text-align:right;
}

.arrow{
    color:#777;
    font-size:21px;
}

/* آدرس */
.address{
    margin-top:8px;
    height:55px;
    border-radius:15px;
    background:#f5c400;
    color:#111;
    display:flex;
    align-items:center;
    padding:5px 9px;
}

.address-icon{
    width:43px;
    height:43px;
    min-width:43px;
    background:#111;
    color:#f5c400;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-left:10px;
}

.address-icon svg{
    width:23px;
    height:23px;
}

.address-text strong{
    display:block;
    font-size:12px;
}

.address-text span{
    display:block;
    font-size:10px;
    font-weight:bold;
    margin-top:4px;
}

.footer{
    text-align:center;
    color:#666;
    font-size:9px;
    margin-top:9px;
}

@media(max-height:650px){

    .page{
        padding-top:8px;
        padding-bottom:8px;
    }

    .logo{
        width:82px;
        height:82px;
    }

    .logo-area{
        margin-bottom:5px;
    }

    .title{
        margin-bottom:8px;
    }

    .title h1{
        font-size:21px;
    }

    .link,
    .address{
        height:48px;
    }

    .icon,
    .address-icon{
        width:37px;
        height:37px;
        min-width:37px;
    }

    .footer{
        margin-top:5px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- لوگوی اصلی -->
    <div class="logo-area">
        <img src="logo.jpg"
             class="logo"

            <div class="info">
                <strong>تماس مستقیم</strong>

            </div>

        </a>


        <!-- شماره دوم -->

            <div class="icon phone">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2.2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                    19.8 19.8 0 0 1-8.63-3.07
                    19.5 19.5 0 0 1-6-6
                    A19.8 19.8 0 0 1 2.12 4.18

                    a2 2 0 0 1 2 1.72
                    12.8 12.8 0 0 0 .7 2.81

                    a2 2 0 0 1 2.11-.45
                    12.8 12.8 0 0 0 2.81.7
                    A2 2 0 0 1 22 16.92z"/>
                </svg>
            </div>

            <div class="info">
                <strong>تماس مستقیم</strong>
                <span>09925828785</span>
            </div>

            <div class="arrow">‹</div>
        </a>

    </div>


    <!-- آدرس -->
    <div class="address">

        <div class="address-icon">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M20 10c0 5-8 12-8 12S4 15 4 10
                         a8 8 0 1 1 16 0z"/>
                <circle cx="12" cy="10" r="2.5"/>

            </svg>

        </div>

        <div class="address-text">
            <strong>آدرس دفتر</strong>
            <span>خیابان لاله شمالی، بعد از کوچه ۶۸</span>
        </div>

    </div>


    <div class="footer">
        <b>املاک عادل</b>
    </div>

</div>

</body>
</html>
