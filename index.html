<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>املاک عادل | خرید و فروش ملک</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f4f4;
      color: #171717;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 14px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    }

    /* قسمت بالای صفحه */
    .header {
      background: #f4c400;
      padding: 34px 20px 28px;
      text-align: center;
      position: relative;
    }

    .header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 18px;
      background: white;
      border-radius: 50% 50% 0 0;
    }

    .logo {
      width: 125px;
      height: 125px;
      object-fit: contain;
      background: white;
      border-radius: 24px;
      padding: 6px;
      display: block;
      margin: 0 auto 15px;
      box-shadow: 0 7px 20px rgba(0,0,0,0.18);
    }

    h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .content {
      padding: 12px 20px 25px;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: #777;
      margin: 8px 4px 12px;
    }

    /* دکمه ها */
    .button {
      width: 100%;
      min-height: 60px;
      margin: 11px 0;
      border-radius: 17px;
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 10px 17px;
      transition: 0.2s;
      font-size: 16px;
      font-weight: bold;
    }

    .button:active {
      transform: scale(0.98);
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .button-text {
      flex: 1;
      text-align: right;
    }

    .arrow {
      font-size: 20px;
      opacity: 0.5;
    }

    /* اینستاگرام */
    .instagram {
      background: #fff1f7;
      color: #171717;
    }

    .instagram .icon-box {
      background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    }

    /* آیکون Instagram */
    .instagram-icon {
      width: 25px;
      height: 25px;
    }

    /* ایتا */
    .eitaa {
      background: #fff9d9;
      color: #171717;
    }

    .eitaa .icon-box {
      background: #f4c400;
    }

    .eitaa-icon {
      width: 28px;
      height: 28px;
    }

    /* تلفن */
    .phone {
      background: #f7f7f7;
      color: #171717;
    }

    .phone .icon-box {
      background: #f4c400;
      font-size: 22px;
    }

    /* آدرس */
    .address {
      margin-top: 18px;
      background: #171717;
      color: white;
      min-height: 78px;
    }

    .address .icon-box {
      background: #f4c400;
      color: #111;
      font-size: 23px;
    }

    .address-text {
      line-height: 1.9;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin-top: 20px;
    }

  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <!-- Header -->
    <div class="header">

      <img
        src="logo.jpg"
        alt="لوگوی املاک عادل"

      >

      <h1>املاک عادل</h1>

      <div class="subtitle">
        خرید و فروش ملک

    <div class="content">

      </div>


      <!-- Instagram -->
      <a

        <div class="icon-box">

          <svg class="instagram-icon" viewBox="0 0 24 24" fill="none">

        <div class="arrow">

      </a>


      <!-- Eitaa -->

      >

        <div class="icon-box">

          <!-- Eitaa style icon -->
          <svg

          >

            <circle

            />

            <path
              d="M25 49
                 C36 39 49 32 66 32
                 C73 32 77 35 74 43
                 C71 52 66 66 61 73
                 C58 77 54 77 50 74
                 L42 68
                 L35 75
                 C32 78 29 76 28 72

              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        </div>

        <div class="button-text">
          ایتا املاک عادل
        </div>

        <div class="arrow">
          ‹
        </div>

      </a>


      <!-- Phone 1 -->
      <a
        href="tel:09915022443"
        class="button phone"
      >

        <div class="icon-box">
          ☎
        </div>

        <div class="button-text">
          09915022443
        </div>

        <div class="arrow">
          ‹
        </div>

      </a>


      <!-- Phone 2 -->
      <a
        href="tel:09925828785"
        class="button phone"
      >

        <div class="icon-box">
          ☎
        </div>

        <div class="button-text">
          09925828785
        </div>

        <div class="arrow">
          ‹
        </div>

      </a>


      <!-- Address -->
      <div class="button address">

        <div class="icon-box">
          📍
        </div>

        <div class="address-text">
          <strong>آدرس دفتر</strong><br>
          خیابان لاله شمالی، بعد از کوچه ۶۸
        </div>

      </div>


      <div class="footer">
        املاک عادل
      </div>

    </div>

  </div>

</div>

</body>
</html>
