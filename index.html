<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املاک عادل</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#111;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
}

.page{
    width:100%;
    max-width:430px;
    min-height:100vh;
    padding:18px 18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

/* لوگو */
.logo-box{
    text-align:center;
    margin-bottom:16px;
}

.logo{
    width:105px;
    height:105px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
    padding:5px;
    box-shadow:0 0 0 4px #f5c400,
               0 8px 25px rgba(0,0,0,.4);
}

/* عنوان */
.title{
    text-align:center;
    margin-bottom:16px;
}

.title h1{
    font-size:25px;
    color:#f5c400;
    font-weight:900;
}

.title p{
    font-size:11px;
    color:#aaa;
    margin-top:5px;
}

/* لینک ها */
.links{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.link{
    height:57px;
    width:100%;
    border-radius:16px;
    text-decoration:none;
    color:#fff;
    background:#202020;
    border:1px solid #333;
    display:flex;
    align-items:center;
    padding:6px 9px;
    transition:.2s;
}

.link:active{
    transform:scale(.98);
}

.icon{
    width:45px;
    height:45px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-left:11px;
}

.icon svg{
    width:25px;
    height:25px;
}

.instagram{
    background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
}

.eitaa{
    background:#159bd7;
}

.phone{
    background:#f5c400;
    color:#111;
}

.info{
    flex:1;
}

.info strong{
    display:block;
    font-size:13px;
    margin-bottom:3px;
}

.info span{
    display:block;
    font-size:10px;
    color:#999;
    direction:ltr;
    text-align:right;
}

.arrow{
    color:#777;
    font-size:22px;
    padding-left:5px;
}

/* آدرس */
.address{
    margin-top:9px;
    min-height:57px;
    border-radius:16px;
    background:#f5c400;
    color:#111;
    display:flex;
    align-items:center;
    padding:7px 10px;
}

.address-icon{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:12px;
    background:#111;
    color:#f5c400;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-left:11px;
}

.address-icon svg{
    width:23px;
    height:23px;
}

.address-text strong{
    display:block;
    font-size:12px;
    margin-bottom:4px;
}

.address-text span{
    font-size:10px;
    font-weight:bold;
}

/* پایین صفحه */
.footer{
    text-align:center;
    color:#666;
    font-size:9px;
    margin-top:12px;
}

.footer b{
    color:#f5c400;
}

@media(max-height:650px){
    .page{
        padding-top:10px;
        padding-bottom:10px;
    }

    .logo{
        width:82px;
        height:82px;
    }

    .logo-box{
        margin-bottom:8px;
    }

    .title{
        margin-bottom:9px;
    }

    .title h1{
        font-size:21px;
    }

    .links{
        gap:6px;
    }

    .link,
    .address{
        height:51px;
        min-height:51px;
    }

    .icon,
    .address-icon{
        width:39px;
        height:39px;
        min-width:39px;
    }

    .footer{
        margin-top:7px;
    }
}
</style>
</head>

<body>

            <div class="info">
                <strong>تماس مستقیم</strong>

    </div>


    <!-- Address -->
    <div class="address">

        <div class="address-icon">
            <svg viewBox="0 0 24 24"

                 stroke-width="2"
                 stroke-linecap="round"

                <path d="M20 10c0 5-8 12-8 12S4 15 4 10

        <div class="address-text">
            <strong>آدرس دفتر</strong>

    <div class="footer">
        <b>املاک عادل</b> | همراه مطمئن شما در معاملات ملکی

</div>

</body>
</html>
