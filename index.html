<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>املاک عادل</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #111111 0%, #202020 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #181818;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0,0,0,.55);
      border: 1px solid #333;
    }

    .top {
      background: #f5c400;
      padding: 30px 20px 25px;
      text-align: center;
      color: #111;
    }

    .logo {
      width: 125px;
      height: 125px;
      object-fit: cover;
      border-radius: 25px;
      background: white;
      display: block;
      margin: 0 auto 15px;
      border: 5px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
      font-weight: 900;
    }

    .subtitle {
      font-size: 15px;
      font-weight: bold;
      margin-top: 7px;
    }

    .content {
      padding: 22px 20px 25px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      margin: 12px 0;
      padding: 13px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .instagram {
      background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
      color: white;
    }

    .eitaa {
      background: #f5c400;
      color: #111;
    }

    .phone {
      background: white;
      color: #111;
    }

    .address {
      background: #292929;
      color: white;
      border: 1px solid #444;
      line-height: 1.8;
    }

    .icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .location-icon {
      font-size: 25px;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="top">

        <img
          src="logo.jpg"
          alt="لوگوی املاک عادل"
          class="logo"
        >

        <h1>املاک عادل</h1>

        <div class="subtitle">
          خرید و فروش ملک
        </div>

      </div>


      <div class="content">

        <!-- Instagram -->
        <a
          class="button instagram"
          href="https://www.instagram.com/amlak_adel_1370/"
          target="_blank"
        >

          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="5"
                  stroke="white" stroke-width="2"/>
            <circle cx="12" cy="12" r="4"
                    stroke="white" stroke-width="2"/>
            <circle cx="17.5" cy="6.5" r="1.2"
                    fill="white"/>
          </svg>

          <span>اینستاگرام املاک عادل</span>

        </a>


        <!-- Eitaa -->
        <a
          class="button eitaa"
          href="https://eitaa.com/adell3088"
          target="_blank"
        >

          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="11" fill="#111"/>
            <path
              d="M6 12.2c2.8-2.6 5.5-4 8.2-4.1 1.1 0 1.6.5 1.3 1.5-.5 1.8-1.5 4.4-2.2 5.7-.4.8-1 .9-1.6.4l-2-1.6-1.2 1.1c-.3.3-.6.3-.8-.1l-.5-1.5-1.2-.4c-.6-.2-.6-.6 0-1z"
              fill="#f5c400"
            />
          </svg>

          <span>ایتا املاک عادل</span>

        </a>


        <!-- Phone 1 -->
        <a
          class="button phone"
          href="tel:09915022443"
        >
          📞
          <span>09915022443</span>
        </a>


        <!-- Phone 2 -->
        <a
          class="button phone"
          href="tel:09925828785"
        >
          📞
          <span>09925828785</span>
        </a>


        <!-- Address -->
        <a
          class="button address"
          href="https://www.google.com/maps/search/?api=1&query=خیابان+لاله+شمالی+بعد+از+کوچه+68"
          target="_blank"
        >

          <span class="location-icon">📍</span>

          <span>
            خیابان لاله شمالی<br>
            بعد از کوچه ۶۸
          </span>

        </a>


        <div class="footer">
          املاک عادل
        </div>

      </div>

    </div>

  </div>

</body>
</html>
